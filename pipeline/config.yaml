# Конфигурация pipeline учебного параллельного корпуса EN/ZH/RU.
# Все пути — относительно корня репозитория.

paths:
  raw: data/raw                # входные тексты: data/raw/<text_id>/{en,zh,ru}.txt + meta.json
  manual: data/manual          # ручные правки, импортированные из CSV
  output: web/public/data      # corpus.json, corpus.csv, stats.json для сайта
  logs: logs                   # журнал сборки build_report.md
  llm_cache: data/llm_cache    # сохранённые ответы LLM (хранятся в git: сборка без ключа их применяет)
  gold: data/gold/gold.json    # золотой стандарт — создаёт только эксперт в режиме «Проверка»
  reports: reports             # отчёты для курсовой: evaluation.md, CSV, PNG
  approbation: data/approbation  # CSV-файлы режима «Тест» (экспорт участников)

segmentation:
  # Знаки конца предложения для китайского текста.
  zh_terminators: "。！？；…!?"
  # Закрывающие кавычки и скобки, которые остаются с предыдущим предложением.
  zh_closing: "」』”’）》)\"'"

alignment:
  pivot: en                    # опорный язык: EN–ZH и EN–RU выравниваются отдельно
  # auto — попробовать bertalign → LaBSE (sentence-transformers) → Гейл–Чёрч.
  # Можно указать метод явно: bertalign | labse | gale_church
  method: auto
  model: sentence-transformers/LaBSE
  # Разрешённые типы соответствий (число предложений опорного языка – второго языка).
  types: [[1, 1], [1, 2], [2, 1]]
  # Разрешать пропуски (1–0 / 0–1) только как аварийный вариант, с большим штрафом.
  allow_skips: true
  # Если число абзацев во всех трёх файлах совпадает, выравнивать по абзацам.
  use_paragraphs: true
  gale_church:
    # Дисперсия разности длин (Gale & Church, 1993: 6.8 для европейских языков).
    # Для китайского одна графема несёт больше информации, поэтому разброс выше.
    variance:
      zh: 9.0
      ru: 6.8
    # Априорные вероятности типов соответствий.
    priors:
      "1-1": 0.89
      "1-2": 0.0445
      "2-1": 0.0445
      "1-0": 0.0049
      "0-1": 0.0049
  # Порог «низкого» alignment_score: такие пары отправляются на LLM-проверку
  # и помечаются в интерфейсе. Шкалы методов различаются.
  low_score_threshold:
    gale_church: 0.35
    labse: 0.55
    bertalign: 0.55

annotation:
  en:
    spacy_model: en_core_web_sm
  zh:
    classifiers_file: pipeline/resources/zh_classifiers.tsv
    # Определители перед счётным словом (кроме числительных).
    demonstratives: ["这", "那", "哪", "每", "某"]
    # Сколько слов-модификаторов может стоять между 量词 и существительным.
    max_modifiers: 4
    # Слова, в которых сочетание «число + 量词» не является конструкцией со счётным словом.
    exclude_words: ["一样", "一下", "一下子", "一点", "一点儿", "一会儿", "一口气", "一本正经",
                    "一起", "一直", "一定", "一共", "一切", "一边", "一身", "一把手", "一部分",
                    "部分"]
  ru:
    # Если вероятность лучшего разбора (после учёта предлогов и согласования)
    # ниже порога, разметка считается спорной.
    ambiguity_threshold: 0.8

llm:
  # Модуль включается, только если в .env (или окружении) есть ANTHROPIC_API_KEY.
  model: claude-opus-5
  effort: medium               # low | medium | high — глубина рассуждений модели
  max_items: 40                # не больше N пар за одну сборку (контроль расходов)
  check_low_scores: true       # проверять пары с низким alignment_score
  check_disputed: true         # проверять спорную разметку
  timeout_seconds: 120

export:
  csv_delimiter: ","           # импорт умеет определять разделитель сам (, или ;)
  histogram_bins: 10

difficulty:
  # Границы условных уровней A1|A2|B1|B2|C1|C2 для оценки сложности (pipeline/difficulty.py).
  # По умолчанию — калибровка по учебным текстам корпуса (см. README, «Оценка сложности»).
  thresholds: [0.19, 0.22, 0.28, 0.345, 0.45]

importers:
  cache: data/sources          # скачанные выгрузки (в git не хранятся)
  tatoeba:
    limit: 500                 # сколько троек EN–ZH–RU взять (0 — все прошедшие фильтры)
    seed: 2026                 # случайная выборка воспроизводима
    filters:
      en_words: [3, 25]        # длина английского предложения в словах
      ru_words: [3, 25]
      zh_chars: [4, 40]        # длина китайского предложения в иероглифах
    # Адреса выгрузок (https://tatoeba.org/downloads); можно заменить на зеркало.
    files:
      eng: https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences_detailed.tsv.bz2
      cmn: https://downloads.tatoeba.org/exports/per_language/cmn/cmn_sentences_detailed.tsv.bz2
      rus: https://downloads.tatoeba.org/exports/per_language/rus/rus_sentences_detailed.tsv.bz2
      links: https://downloads.tatoeba.org/exports/links.tar.bz2
      cc0: https://downloads.tatoeba.org/exports/sentences_CC0.tar.bz2
  un_corpus:
    limit: 2000                # сколько троек взять из корпуса ООН
    seed: 2026
    max_lines: 3000000         # сколько первых строк файлов просматривать
    # Брать только законченные предложения (без заголовков, пунктов таблиц и обрывков).
    sentences_only: true
    # Прямая ссылка на архив .tar.gz с файлами *.en/*.zh/*.ru. Пусто — файлы кладутся
    # вручную в data/sources/un_corpus/ (инструкция — в README и в сообщении команды).
    url: ""
    # Если url пуст — попарные выгрузки того же корпуса на OPUS (большие zip-архивы; скачиваются
    # один раз в data/sources/un_corpus/ и читаются без распаковки). Уберите адреса, чтобы
    # ничего не скачивать.
    opus:
      en-zh: https://object.pouta.csc.fi/OPUS-UNPC/v1.0/moses/en-zh.txt.zip
      en-ru: https://object.pouta.csc.fi/OPUS-UNPC/v1.0/moses/en-ru.txt.zip
    filters:
      en_words: [3, 40]        # в официальных документах предложения длиннее
      ru_words: [3, 40]
      zh_chars: [4, 70]
