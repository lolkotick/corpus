# Настройки инструментов для pipeline/ (сам pipeline запускается как `python -m pipeline`).
[project]
name = "corpus-pipeline"
version = "1.0.0"
description = "Pipeline учебного параллельного корпуса EN/ZH/RU"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q"
filterwarnings = ["ignore:pkg_resources is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица и иероглифы в строках — это норма для корпуса
