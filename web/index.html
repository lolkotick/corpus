<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Учебный параллельный корпус английского, китайского и русского языков: артикли, счётные слова 量词 и падежи."
    />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Параллельный корпус EN · ZH · RU" />
    <meta
      property="og:description"
      content="Учебный параллельный корпус: поиск на трёх языках, KWIC, статистика и упражнения на артикли, 量词 и падежи."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Параллельный корпус EN · ZH · RU</title>
    <script>
      // Тема применяется до отрисовки, чтобы не было вспышки светлой темы.
      (function () {
        try {
          var saved = localStorage.getItem('corpus.theme');
          if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        } catch (e) {
          /* localStorage недоступен — используется системная тема */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
    />
  </head>
  <body>
    <noscript>Для работы сайта нужен JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
